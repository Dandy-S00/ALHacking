# netchian configuration
# Place your NVD API key here to increase rate limits (50 req/30s vs 5/30s)
# Get one at: https://nvd.nist.gov/developers/request-an-api-key
nvd_api_key: ""

# Default scan settings
defaults:
  intensity: "default"     # stealth | default | aggressive
  output_format: "table"   # table | json | markdown
  min_cvss: 0.0            # Show all CVEs by default

# ExploitDB settings
exploitdb:
  local_path: "/usr/share/exploitdb"
  searchsploit_bin: "/usr/bin/searchsploit"
